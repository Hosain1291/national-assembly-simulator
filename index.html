/* Layout: one narrow column like a parliamentary record — chamber diagram on top, agenda items below, a media-style scrubber as the voting control */
:root{
  --bg:#eef0ed; --surface:#fbfcfa; --sunk:#e3e7e3; --line:#d3d9d4; --line2:#bfc7c1;
  --ink:#16201c; --ink2:#47534e; --ink3:#7b8681;
  --accent:#2a6a5d; --accent-ink:#ffffff; --gold:#93763a;
  --ok:#2f7d4f; --warn:#b4552d; --pa:#4d7c8a; --pb:#a9773b; --link:#3366cc;
  --f-display:"HadaBatang","Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"HadaBatang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --surface:#171d1b; --sunk:#121716; --line:#29312e; --line2:#36403c;
  --ink:#e5ebe8; --ink2:#a6b1ac; --ink3:#727d78;
  --accent:#6fb5a4; --accent-ink:#0f1312; --gold:#c9a866; --ok:#6cc08f; --warn:#e08a63; --pa:#7fb0bd; --pb:#d4a165; --link:#8ab4f8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --surface:#171d1b; --sunk:#121716; --line:#29312e; --line2:#36403c;
  --ink:#e5ebe8; --ink2:#a6b1ac; --ink3:#727d78;
  --accent:#6fb5a4; --accent-ink:#0f1312; --gold:#c9a866; --ok:#6cc08f; --warn:#e08a63; --pa:#7fb0bd; --pb:#d4a165; --link:#8ab4f8; color-scheme:dark}
/* 직접 고른 테마는 접속 기기·앱 설정보다 우선 */
html:root[data-skin="light"]{--bg:#eef0ed; --surface:#fbfcfa; --sunk:#e3e7e3; --line:#d3d9d4; --line2:#bfc7c1; --ink:#16201c; --ink2:#47534e; --ink3:#7b8681; --accent:#2a6a5d; --accent-ink:#ffffff; --gold:#93763a; --ok:#2f7d4f; --warn:#b4552d; --pa:#4d7c8a; --pb:#a9773b; --link:#3366cc; color-scheme:light}
html:root[data-skin="dark"]{--bg:#0f1312; --surface:#171d1b; --sunk:#121716; --line:#29312e; --line2:#36403c; --ink:#e5ebe8; --ink2:#a6b1ac; --ink3:#727d78; --accent:#6fb5a4; --accent-ink:#0f1312; --gold:#c9a866; --ok:#6cc08f; --warn:#e08a63; --pa:#7fb0bd; --pb:#d4a165; --link:#8ab4f8; color-scheme:dark}
html:root[data-skin="mint"]{--bg:#e3f4ee; --surface:#f5fcf9; --sunk:#d2ebe2; --line:#b9dccf; --line2:#9ccbb9; --ink:#0f2f28; --ink2:#355c52; --ink3:#668b81; --accent:#0e8b70; --accent-ink:#ffffff; --gold:#8f7a2c; --ok:#1f7d4a; --warn:#b4552d; --pa:#2f7f8f; --pb:#b07a35; --link:#0a7660; color-scheme:light}
.skin{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;gap:2px;background:var(--surface)}
.skin button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.skin button i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.skin button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.top{flex-wrap:wrap}
*{box-sizing:border-box}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.lean{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--pa),var(--sunk) 50%,var(--pb));margin-top:6px;max-width:220px}
.lean i{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink3)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding:0 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.3;text-wrap:balance;margin:0}
h3{font-size:19px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand svg{width:30px;height:20px;flex:none}
.brand small{display:block;font-weight:500;color:var(--ink3);font-size:12px;letter-spacing:.06em}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink3);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stack{display:grid;gap:16px}
.hint{color:var(--ink3);font-size:13px;margin:0}
.sub{margin:4px 0 12px}
.link{background:none;border:0;padding:4px 0;color:var(--ink2);font-weight:600;font-size:14px}
.link:hover{color:var(--accent)}
.cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.cta:disabled{opacity:.4;cursor:default}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.ring{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--ink2)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.intro h1{font-size:clamp(26px,6vw,36px)}
.intro p{color:var(--ink2);max-width:62ch;margin:8px 0 0}

.eras{display:grid;gap:12px}
.era{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.era>span{font-size:12px;color:var(--ink3);font-weight:600;padding-top:9px;letter-spacing:.04em}
.era .row{display:flex;flex-wrap:wrap;gap:6px}
.asm{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;display:grid;line-height:1.25;text-align:left;min-width:62px}
.asm b{font-size:14px}
.asm small{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.asm[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.asm[aria-pressed="true"] small{color:inherit;opacity:.7}
@media (max-width:480px){.era{grid-template-columns:1fr;gap:4px}.era>span{padding-top:0}}

.detail h2{font-size:26px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 4px}
.facts div{border-top:1px solid var(--line);padding-top:6px}
.facts dt{font-size:12px;color:var(--ink3)}
.facts dd{margin:0;font-weight:600}
.desc{color:var(--ink2);margin:10px 0 0}
.sysbar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:12px 0 4px;background:var(--sunk)}
.sysbar span{height:100%}
.syslg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.syslg span{display:flex;gap:6px;align-items:center}
.hemi svg{width:100%;height:auto;display:block}
.hemi .seat{transition:fill .5s ease,stroke .5s ease}
.hemi .big{font-family:var(--f-display);font-weight:800;font-size:46px;fill:var(--ink)}
.hemi .sm{font-size:15px;fill:var(--ink3)}
.hlg{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink3);margin-top:4px}
.hlg span{display:flex;gap:6px;align-items:center}
.plist{display:grid;gap:2px;margin-top:6px}
.prow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{font-weight:600}
.prow small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.4}
.opts{display:grid;gap:10px;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.chk small{display:block;color:var(--ink3);font-size:12.5px}
.launch{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.launch span{color:var(--ink3);font-size:13px}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{display:grid;grid-auto-flow:column;gap:3px;margin:14px 0 18px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.done{background:var(--accent)}
.prog i.skip{background:var(--line2)}
.prog i.cur{background:var(--ink)}
.qmeta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink3);flex-wrap:wrap}
.qmeta b{color:var(--ink2)}
.qtitle{font-size:clamp(24px,6vw,32px);margin:6px 0 16px}
.poles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pole{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:grid;gap:6px;align-content:start;transition:opacity .2s,border-color .2s;opacity:var(--o,1);min-width:0}
.pole.r{text-align:right}
.pole .pn{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;color:var(--ink2)}
.pole.r .pn{justify-content:flex-end}
.pole .pn i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.pole .ps{font-size:15px;line-height:1.45;font-weight:500}
.pole.on{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.pole em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink3)}

.player{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px 16px}
.track{position:relative;height:44px;touch-action:none;cursor:pointer;margin:18px 6px 0}
.rail{position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.rail::before,.rail::after{content:"";position:absolute;top:0;bottom:0;width:6px;border-radius:4px}
.rail::before{left:0;background:var(--lc)}
.rail::after{right:0;background:var(--rc)}
.fill{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--fc,var(--accent))}
.tick{position:absolute;top:50%;width:1px;height:14px;margin-top:-7px;background:var(--line2)}
.tick.c{height:22px;margin-top:-11px;background:var(--ink3)}
.thumb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--surface);border:3px solid var(--fc,var(--ink3));box-shadow:0 1px 4px rgba(0,0,0,.25)}
.track:not(.set) .thumb{border-style:dashed}
.bubble{position:absolute;bottom:100%;transform:translateX(-50%);margin-bottom:-2px;font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 6px;white-space:nowrap;pointer-events:none}
.track:not(.set) .bubble{opacity:0}
.track.anim .thumb,.track.anim .fill,.track.anim .bubble{transition:left .18s ease,width .18s ease}
.pdot{position:absolute;top:50%;width:10px;height:10px;margin:-17px 0 0 -5px;border-radius:50%;border:1.5px solid var(--surface)}
.time{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink3);margin-top:4px}
.time span{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.read{text-align:center;font-weight:600;color:var(--ink);margin:10px 0 0;min-height:1.6em}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;font-weight:700}
.ic svg{width:18px;height:18px;fill:currentColor}
.ic:disabled{opacity:.35;cursor:default}
.play{padding:0 22px;height:52px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;display:flex;gap:8px;align-items:center;font-weight:700}
.play svg{width:16px;height:16px;fill:currentColor}
.play:disabled{opacity:.4;cursor:default}
.imp{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.imp .lh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.imp .lh b{color:var(--ink)}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg5 button{border:0;border-right:1px solid var(--line);background:transparent;padding:8px 2px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.2}
.seg5 button:last-child{border-right:0}
.seg5 button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg5.mini{max-width:420px}
.seg5.mini button{padding:5px 2px;font-size:11.5px}
.subctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dleg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:12px;font-size:12px;color:var(--ink2)}
.dleg span{display:flex;gap:5px;align-items:center}
.live{margin-top:16px}
.live .lh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:6px;gap:8px}
.lbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk);position:relative}
.lbar span{display:block;height:100%;transition:width .3s ease}
.lbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.llg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--ink2)}
.llg span{display:flex;gap:5px;align-items:center}
.kbd{font-size:12px;color:var(--ink3);text-align:center;margin-top:10px}

.rhead h2{font-size:clamp(26px,6vw,34px)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;color:var(--ink2)}
.pill.strong{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lead{color:var(--ink2);margin:6px 0 0;max-width:62ch}
.tw{overflow-x:auto;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.tbl th{font-size:12px;color:var(--ink3);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left;font-family:var(--f-body)}
.tbl td:first-child span{display:flex;gap:8px;align-items:center}
.up{color:var(--ok)} .down{color:var(--warn)}
.thr{display:grid;gap:10px}
.thr .t{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.thr .t b{font-weight:600}
.thr .t .num{font-weight:600}
.thr .t small{grid-column:1/-1;color:var(--ink3);font-size:12.5px}
.meter{position:relative;height:14px;border-radius:4px;background:var(--sunk);display:flex;overflow:hidden;margin:4px 0 2px}
.meter span{height:100%}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.mk.l2{background:var(--gold)}
.mlab{position:relative;height:16px;font-size:11px;color:var(--ink3);font-family:var(--f-mono)}
.mlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cmp svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.cmp .ax{font-size:10.5px;fill:var(--ink3)}
.cmp .lb{font-size:10.5px;fill:var(--ink2);font-weight:600}
.cmp .lb.you{fill:var(--ink);font-weight:700}
.match{display:grid;gap:8px}
.match .m{display:grid;grid-template-columns:12px 1fr 52px;gap:10px;align-items:center}
.match .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.match .bar span{display:block;height:100%}
.bill{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.bill:first-child{border-top:0;padding-top:0}
.bill h4{margin:0 0 4px;font-size:15px}
.bill .you{font-size:13px;color:var(--ink2);margin:0 0 8px}
.bill .stake{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:8px 0 4px;font-size:12.5px;color:var(--ink3)}
.vrow{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink3);margin-top:8px}
.vbar{position:relative;height:16px;border-radius:4px;overflow:hidden;background:var(--sunk);display:flex}
.vbar span{height:100%}
.vbar em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.vnum{grid-column:2;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;gap:6px}
.verdict{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
details.how summary{cursor:pointer;font-weight:700}
details.how p{color:var(--ink2);font-size:14px;margin:10px 0 0}
.foot{color:var(--ink3);font-size:12px;margin-top:22px;line-height:1.6}
@media (max-width:480px){.poles{grid-template-columns:1fr}.pole.r{text-align:left}.pole.r .pn{justify-content:flex-start}.pole.r .pn i{order:-1}.box{padding:15px}.seg5 button{font-size:11.5px}}
.frow{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.frow:first-child{padding-top:0}
.frow:last-child{border-bottom:0;padding-bottom:0}
.frow .fh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.stepper{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}

.stepper button:disabled{opacity:.35;cursor:default}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink)}
.stakebox{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.stakebox b{color:var(--ink);font-family:var(--f-mono)}
.brow{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.brow .add{font-family:var(--f-mono);font-size:13px;color:var(--ok);min-width:40px;text-align:right}
.brow .add.zero{color:var(--ink3)}
.brow .cum{font-family:var(--f-mono);font-weight:700;min-width:36px;text-align:right}
.brow .bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:4px;overflow:hidden}
.brow .bar span{display:block;height:100%}
.fbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:6px 0 4px}
.fbar span{height:100%}
.wb-wrap{overflow-x:auto}
.wb{width:100%;max-width:440px;min-width:300px;margin:0 auto;border-collapse:collapse;background:var(--sunk);border:1px solid var(--line2);font-size:13px;line-height:1.45;color:var(--ink)}

  Object.keys(cur).forEach(k=>{ if(k==='Q'||k==='P') return; if(JSON.stringify(cur[k])!==JSON.stringify(base[k])) d[k]=cur[k]; });
  ['Q','P'].forEach(k=>{ if(JSON.stringify(cur[k])===JSON.stringify(base[k])) return;
    if(cur[k].length===base[k].length){ const m={}; cur[k].forEach((x,i)=>{ const b=base[k][i], ch={}; Object.keys(x).forEach(f=>{ if(JSON.stringify(x[f])!==JSON.stringify(b[f])) ch[f]=x[f]; }); if(Object.keys(ch).length) m[i]=ch; }); d[k+'d']=m; }
    else d[k]=cur[k]; });
  return d; }
function applyDiff(n,d){ const i=DATA.findIndex(x=>x.n===n); if(i<0) return null; const c=canon(baseScenario(i));
  Object.keys(d).forEach(k=>{ if(k==='Qd'||k==='Pd'){ const arr=c[k[0]]; Object.keys(d[k]).forEach(j=>{ if(arr[+j]) Object.assign(arr[+j],d[k][j]); }); } else c[k]=d[k]; }); c.n=n; return norm(c); }
async function makeCode(c){ const js=JSON.stringify(diffOf(c)); if(js==='{}') return 'KR1.'+c.n;
  try{ return 'KR1.'+c.n+'.z'+B64(await zip(js,true)); }catch(e){ return 'KR1.'+c.n+'.j'+B64(new TextEncoder().encode(js)); } }
async function readCode(t){ t=String(t||'').trim(); if(t[0]==='{') return norm(JSON.parse(t)); t=t.replace(/\s+/g,'');
  const m=/^KR1\.(\d+)(?:\.([zj])([A-Za-z0-9_-]+))?$/.exec(t); if(!m) return null; const n=+m[1]; if(!m[3]) return applyDiff(n,{});
  const u=UNB64(m[3]), js=m[2]==='j'?new TextDecoder().decode(u):await zip(u,false); return applyDiff(n,JSON.parse(js)); }
// ── TXT 저장·불러오기: 사람이 읽을 머리말 + 이동 코드 + 전체 데이터(로고·사진 포함)
const TXT_MARK='----- 전체 데이터 (이 아래는 고치지 마세요) -----';
async function buildTxt(){ const code=await makeCode(C), now=new Date(), pad=n=>String(n).padStart(2,'0');
  const head=['대한민국 국회 시뮬레이터 시험 파일','국회: '+asmName(C)+' ('+C.y+'년 총선)','의원 정수: '+C.N+'석 · '+sysText(C),'정당: '+C.P.map(p=>p.n).join(', '),
    '질문: '+C.Q.filter(q=>q.on).length+'개 · 분야 '+C.F.length+'개','저장한 때: '+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes()),'',
    '----- 이동 코드 -----',code,'',TXT_MARK,strip(C),''];
  return head.join('\n'); }
async function saveTxt(){ const msg=$('#iomsg'); let txt; try{ txt=await buildTxt(); }catch(e){ if(msg) msg.textContent='파일 내용을 만들지 못했습니다.'; return; }
  const fname='국회시뮬레이터_'+(C.n===1?'제헌':'제'+C.n+'대')+'.txt';
  let dl=null; try{ dl=window.claude&&await window.claude.use('downloads'); }catch(_){ dl=null; }
  if(!dl){ const ta=$('#io'); if(ta){ ta.value=txt; ta.focus(); ta.select(); } if(msg) msg.textContent='이 화면에서는 파일 저장을 쓸 수 없어 내용을 칸에 띄웠습니다. 복사해서 메모장에 .txt로 저장하세요.'; return; }
  try{ await dl.save({filename:fname,data:txt}); if(msg) msg.textContent=fname+' 파일을 저장했습니다.'; }
  catch(e){ const c=e&&e.code; if(msg) msg.textContent=c==='declined'?'저장을 취소했습니다.':c==='rate_limited'?'저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러 주세요.':'파일을 저장하지 못했습니다. “코드 복사”를 이용해 주세요.'; } }
async function parseTxt(t){ t=String(t||''); const i=t.indexOf(TXT_MARK);
  if(i>=0){ const j=t.indexOf('{',i); if(j>=0){ try{ const c=norm(JSON.parse(t.slice(j,t.lastIndexOf('}')+1))); if(c) return c; }catch(_){} } }
  const m=/KR1\.\d+(?:\.[zj][A-Za-z0-9_-]+)?/.exec(t); if(m) return await readCode(m[0]);
  const k=t.indexOf('{'); if(k>=0){ try{ return norm(JSON.parse(t.slice(k,t.lastIndexOf('}')+1))); }catch(_){} }
  return null; }
function loadTxt(el){ const f=el.files[0], msg=$('#iomsg'); const rd=new FileReader();
  rd.onload=()=>{ parseTxt(rd.result).then(c=>{ el.value=''; if(!c){ if(msg) msg.textContent='이 파일에서 시험을 찾지 못했습니다. 이 시뮬레이터에서 저장한 TXT 파일인지 확인해 주세요.'; return; }
    S.ai=DATA.findIndex(d=>d.n===c.n); try{ localStorage.setItem('kr-asm-sel',S.ai); }catch(_){} C=c; setFields(); save(); OPEN.io=true; rerender(); const m2=$('#iomsg'); if(m2) m2.textContent=asmName(C)+' 시험을 TXT 파일에서 불러왔습니다.'; })
    .catch(()=>{ if(msg) msg.textContent='파일을 읽지 못했습니다.'; }); };
  rd.onerror=()=>{ if(msg) msg.textContent='파일을 읽지 못했습니다.'; }; rd.readAsText(f,'utf-8'); }
let ioTimer=null;
function fillIO(now){ clearTimeout(ioTimer); ioTimer=setTimeout(()=>{ const ta=$('#io'); if(!ta) return; makeCode(C).then(code=>{ const t=$('#io'); if(!t) return; t.value=code; const m=$('#iomsg'); if(m&&now) m.textContent='코드를 만들었습니다 ('+code.length+'자). 원래 데이터와 달라진 부분만 담깁니다.'; }); },now?0:400); }
function setPath(path,v){ const ps=path.split('.'); let o=C; for(let i=0;i<ps.length-1;i++) o=o[ps[i]]; o[ps[ps.length-1]]=v; }
function fixAsm(){ C.D=ci(C.D,0,1000); C.Lst=ci(C.Lst,0,1000); C.semi=ci(C.semi,0,C.Lst); C.bonus=ci(C.bonus,0,C.Lst-C.semi); C.thr=clamp(+C.thr||0,0,20);
  ['semi','bonus'].forEach(k=>{ const el=$('#e-'+k); if(el&&document.activeElement!==el&&+el.value!==C[k]) el.value=C[k]; }); }
function syncColor(i){ const p=C.P[i], d=$('[data-pd="'+i+'"]'); if(d) d.innerHTML=mark(p,18);
  const h=$('#phx-'+p.k); if(h&&document.activeElement!==h) h.value=p.c.toUpperCase(); const ci2=$('#pc-'+p.k); if(ci2&&ci2.value.toLowerCase()!==p.c.toLowerCase()) ci2.value=p.c;
  const lb=$('#plg-'+p.k); if(lb){ const box=lb.closest('.lgrow').querySelector('.lgbox'); if(box) box.style.setProperty('--c',p.c); }
  $$('.sw[data-i="'+i+'"][data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c.toLowerCase()===p.c.toLowerCase())); }
function onEdInput(e){
  const el=e.target;
  if(el.dataset.hex!=null){ let v=el.value.trim(); if(v[0]!=='#') v='#'+v; if(HEX.test(v)){ C.P[+el.dataset.hex].c=v.toLowerCase(); save(); syncColor(+el.dataset.hex); } return; }
  if(el.dataset.qp!=null){ const i=+el.dataset.qp, k=el.dataset.pk; C.Q[i].p[k]=+el.value; save(); const b=$('[data-qv="'+i+'-'+k+'"]'); if(b) b.textContent=fmtP(+el.value); return; }
  if(el.dataset.fix!=null){ const n=ci(el.value,0,1000); if(n) C.fixed[el.dataset.fix]=n; else delete C.fixed[el.dataset.fix]; save(); $('#asmsum').innerHTML=asmSum(); return; }
  if(el.dataset.gov!=null){ const k=el.dataset.gov; C.gov=C.gov.filter(x=>x!==k); if(el.checked) C.gov.push(k); save(); const i=C.P.findIndex(p=>p.k===k); const s=$('[data-ps="'+i+'"]'); if(s) s.textContent=C.P[i].s+'석'+(el.checked?' · 여당':''); return; }
  const k=el.dataset.k; if(!k) return;
  let v=el.type==='checkbox'?el.checked:el.dataset.num?+el.value:el.dataset.bool?el.value==='1':el.value;
  if(el.dataset.num&&!Number.isFinite(v)) return;
  if(/^Q\.\d+\.(L|R)$/.test(k)) v=v||null;
  setPath(k,v);
  if(ASMK.includes(k)) fixAsm();
  save();
  let m;
  if(ASMK.includes(k)) $('#asmsum').innerHTML=asmSum();
  else if((m=/^P\.(\d+)\.(n|c|l|s)$/.exec(k))){ const i=+m[1], p=C.P[i];
    if(m[2]==='n'){ const b=$('[data-pn="'+i+'"]'); if(b) b.textContent=p.n; }
    if(m[2]==='c'){ syncColor(i); }
    if(m[2]==='l'){ const d=$('[data-lv="'+i+'"]'); if(d) d.textContent=fmtL(p.l); }
    if(m[2]==='s'){ const d=$('[data-ps="'+i+'"]'); if(d) d.textContent=p.s+'석'+(C.gov.includes(p.k)?' · 여당':''); $('#asmsum').innerHTML=asmSum(); } }
  else if((m=/^Q\.(\d+)\.on$/.exec(k))){ const d=$('.qed[data-qi="'+m[1]+'"]'); if(d) d.classList.toggle('off',!v); }
  if(el.dataset.re) rerender(); }
function onEdClick(e){
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act, i=+b.dataset.i;
  if(a==='tr'){ const p=C.P[i], id=b.dataset.id, l=((p.tr[id]||0)+1)%4; if(l) p.tr[id]=l; else delete p.tr[id]; b.dataset.l=l; b.setAttribute('aria-pressed',l>0); b.querySelector('small').textContent=SL[l]; save(); return; }
  if(a==='veto'){ const x=b.dataset.a, y=b.dataset.b, j=C.co.veto.findIndex(v=>(v[0]===x&&v[1]===y)||(v[0]===y&&v[1]===x)); if(j>=0) C.co.veto.splice(j,1); else C.co.veto.push([x,y]); save();
    $$('[data-act="veto"]').forEach(c=>{ const cx=c.dataset.a, cy=c.dataset.b; if((cx===x&&cy===y)||(cx===y&&cy===x)) c.setAttribute('aria-pressed',j<0); }); const vs=$('#vetosum'); if(vs) vs.textContent=vetoText(); return; }
  if(a==='coM'){ const c=C.co.named[i], k=b.dataset.pk2, j=c.m.indexOf(k); if(j>=0) c.m.splice(j,1); else c.m.push(k); b.setAttribute('aria-pressed',j<0); save(); return; }
  if(a==='delImg'){ const w=b.dataset.w.split(':'), p=C.P[+w[1]]; if(w[0]==='lead') p.ldph=''; else if(p.pp[+w[2]]) p.pp[+w[2]].img=''; save(); rerender(); return; }
  if(a==='delLogo'){ C.P[i].logo=''; save(); rerender(); return; }
  if(a==='sw'){ C.P[i].c=b.dataset.c.toLowerCase(); save(); syncColor(i); return; }
  if(a==='cNamu'){ C.P[i].c=NAMU[C.n][C.P[i].k].toLowerCase(); save(); syncColor(i); return; }
  if(a==='ppAdd'){ (C.P[i].pp=C.P[i].pp||[]).push({n:'',r:'',s:'',img:''}); OPEN['p'+C.P[i].k]=true; save(); rerender(); const els=$$('[id^="ppn-'+C.P[i].k+'-"]'); if(els.length) els[els.length-1].focus(); return; }
  if(a==='ppDel'){ C.P[i].pp.splice(+b.dataset.j,1); save(); rerender(); return; }
  if(a==='qAuto'){ C.Q[i].p={}; save(); const d=$('.qed[data-qi="'+i+'"]'); if(d) d.outerHTML=qCard(i); return; }
  if(a==='addP'){ const k='p'+Date.now().toString(36); C.P.push({k,n:'새 정당',c:'#8a8f9c',l:0,s:0,d:'',tr:{}}); OPEN.party=true; OPEN['p'+k]=true; }
  else if(a==='delP'){ const k=C.P[i].k; C.P.splice(i,1); C.Q.forEach(q=>{ delete q.p[k]; if(q.L===k) q.L=null; if(q.R===k) q.R=null; }); delete C.fixed[k]; C.gov=C.gov.filter(x=>x!==k);
    C.co.veto=C.co.veto.filter(v=>v[0]!==k&&v[1]!==k); C.co.named.forEach(c=>{ c.m=c.m.filter(x=>x!==k); }); }
  else if(a==='addT'){ const n=$('#ntn').value.trim(); if(!n){ $('#ntn').focus(); return; } C.T.push({id:'t'+Date.now().toString(36),n:n.slice(0,30),e:+$('#nte').value,s:+$('#nts').value}); OPEN.trait=true; }
  else if(a==='delT'){ const id=C.T[+b.dataset.j].id; C.T.splice(+b.dataset.j,1); C.P.forEach(p=>{ delete p.tr[id]; }); }
  else if(a==='addCo'){ C.co.named.push({n:'새 연합',m:[]}); OPEN.coal=true; }
  else if(a==='delCo'){ C.co.named.splice(i,1); }
  else if(a==='addF'){ const k='f'+Date.now().toString(36); C.F.push({k,n:'새 분야',c:'#8a7f9c',d:''}); }
  else if(a==='delF'){ const k=C.F[i].k; C.F.splice(i,1); const to=C.F[0].k; C.Q.forEach(q=>{ if(q.f===k) q.f=to; }); }
  else if(a==='addQ'){ const f=b.dataset.f2; C.Q.push({t:'새 질문',A:'',B:'',L:null,R:null,p:{},ax:'s',g:false,f,on:true}); OPEN.qs=true; OPEN['q'+f]=true; }
  else if(a==='delQ'){ C.Q.splice(i,1); }
  else if(a==='exp'){ fillIO(true); return; }
  else if(a==='txtSave'){ saveTxt(); return; }
  else if(a==='copy'){ const ta=$('#io'); if(!ta.value){ fillIO(true); $('#iomsg').textContent='코드를 만드는 중입니다. 잠시 후 다시 눌러 주세요.'; return; }
    const sel=()=>{ ta.focus(); ta.select(); $('#iomsg').textContent='코드를 선택했습니다. 직접 복사해 주세요.'; };
    try{ navigator.clipboard.writeText(ta.value.trim()).then(()=>{ $('#iomsg').textContent='복사했습니다. ('+ta.value.trim().length+'자)'; },sel); }catch(_){ sel(); } return; }
  else if(a==='imp'){ const txt=$('#io').value; $('#iomsg').textContent='불러오는 중…';
    readCode(txt).then(c=>{ if(!c){ $('#iomsg').textContent='코드를 읽지 못했습니다. KR1로 시작하는 코드를 빠짐없이 붙여 넣어 주세요.'; return; }
      S.ai=DATA.findIndex(d=>d.n===c.n); try{ localStorage.setItem('kr-asm-sel',S.ai); }catch(_){} if(C&&C.n===c.n) c.P.forEach(p=>{ const o=C.P.find(x=>x.k===p.k); if(o){ if(o.logo&&!p.logo) p.logo=o.logo; if(o.ldph&&!p.ldph) p.ldph=o.ldph; (p.pp||[]).forEach(x=>{ const y=(o.pp||[]).find(z=>z.n===x.n); if(y&&y.img&&!x.img) x.img=y.img; }); } }); C=c; setFields(); save(); OPEN.io=true; rerender(); $('#iomsg').textContent=asmName(C)+' 시험을 불러왔습니다.'; })
      .catch(()=>{ $('#iomsg').textContent='코드를 읽지 못했습니다. KR1로 시작하는 코드를 빠짐없이 붙여 넣어 주세요.'; }); return; }
  else if(a==='reset'){ if(!b.dataset.arm){ b.dataset.arm='1'; b.textContent='정말 되돌리기'; $('#rsmsg').textContent='한 번 더 누르면 편집 내용이 모두 지워집니다.'; return; }
    try{ localStorage.removeItem(SKEY(C.n)); }catch(_){} C=baseScenario(S.ai); C._edited=false; setFields(); }
  save(); if(a==='reset'){ try{ localStorage.removeItem(SKEY(C.n)); }catch(_){} C._edited=false; }
  setFields(); rerender(); }

// 테마: 자동(기기 설정) · 라이트 · 다크 · 민트
function setSkin(k){ if(k==='auto') document.documentElement.removeAttribute('data-skin'); else document.documentElement.setAttribute('data-skin',k);
  $$('#skin button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.skin===k)); try{ localStorage.setItem('kr-asm-skin',k); }catch(e){} }
let SK='auto'; try{ SK=localStorage.getItem('kr-asm-skin')||'auto'; }catch(e){} setSkin(SK);
$('#skin').addEventListener('click',e=>{ const b=e.target.closest('button[data-skin]'); if(b) setSkin(b.dataset.skin); });
toHome.addEventListener('click',viewHome);
loadScenario();
viewHome();
})();
